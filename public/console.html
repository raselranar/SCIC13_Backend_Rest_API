<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API Test Console</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2f3a; --txt:#e6e8ee; --mut:#8b93a5; --acc:#4f8cff; --ok:#3fb86f; --bad:#e5484d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; flex:1; }
  .token { font-family:monospace; font-size:12px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px; }
  .wrap { display:grid; grid-template-columns: repeat(auto-fill,minmax(360px,1fr)); gap:14px; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--acc); }
  .card h3 { margin:14px 0 6px; font-size:12px; color:var(--mut); }
  form { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .row { display:flex; gap:6px; }
  input, select { background:#12141a; border:1px solid var(--border); color:var(--txt); border-radius:6px; padding:7px 9px; font:inherit; flex:1; min-width:0; }
  button { background:#232835; color:var(--txt); border:1px solid var(--border); border-radius:6px; padding:7px 11px; font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--acc); }
  button.acc { background:var(--acc); border-color:var(--acc); color:#fff; }
  .out { background:#0c0e12; border:1px solid var(--border); border-radius:6px; padding:8px; font-family:ui-monospace,monospace; font-size:12px; color:var(--ok); overflow:auto; max-height:220px; white-space:pre-wrap; word-break:break-word; }
  .out.err { color:var(--bad); }
  .mut { color:var(--mut); font-size:12px; margin:4px 0 0; }
  code { background:#232835; padding:1px 5px; border-radius:4px; font-size:12px; }
  .flex { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>SCIC13 API Test Console</h1>
  <span class="token" id="tokenLabel">no access token</span>
  <button id="clearStore">clear tokens</button>
</header>

<div class="wrap">
  <!-- AUTH -->
  <div class="card">
    <h2>Auth</h2>
    <form id="regForm">
      <input name="name" placeholder="name" required />
      <input name="email" type="email" placeholder="email" required />
      <input name="password" type="password" placeholder="password (min 8)" required />
      <button class="acc" type="submit">POST /auth/register</button>
    </form>
    <form id="loginForm">
      <input name="email" type="email" placeholder="email" required />
      <input name="password" type="password" placeholder="password" required />
      <button class="acc" type="submit">POST /auth/login</button>
    </form>
    <div class="flex">
      <button id="meBtn">GET /auth/me</button>
      <button id="refreshBtn">POST /auth/refresh</button>
      <button id="logoutBtn">POST /auth/logout</button>
    </div>
    <div class="out" id="authOut">—</div>
  </div>

  <!-- USERS -->
  <div class="card">
    <h2>Users</h2>
    <div class="flex">
      <button id="usersBtn">GET /users</button>
      <input id="userId" placeholder="user id" />
      <button id="userGetBtn">GET /users/:id</button>
      <button id="userPatchBtn">PATCH (admin)</button>
      <button id="userDelBtn">DELETE (admin)</button>
    </div>
    <input id="userPatchName" placeholder="new name (PATCH)" />
    <div class="out" id="usersOut">—</div>
  </div>

  <!-- CATEGORIES -->
  <div class="card">
    <h2>Categories</h2>
    <form id="catForm">
      <input name="name" placeholder="category name" required />
      <button class="acc" type="submit">POST /categories</button>
    </form>
    <div class="flex">
      <button id="catsBtn">GET /categories</button>
      <input id="catId" placeholder="category id" />
      <button id="catPatchBtn">PATCH</button>
      <button id="catDelBtn">DELETE</button>
      <button id="catDelPermBtn">DELETE permanent</button>
    </div>
    <input id="catPatchName" placeholder="new category name (PATCH)" />
    <div class="out" id="catsOut">—</div>
  </div>

  <!-- PRODUCTS -->
  <div class="card">
    <h2>Products</h2>
    <form id="prodForm">
      <input name="name" placeholder="name" required />
      <input name="price" type="number" placeholder="price" required />
      <input name="stock" type="number" placeholder="stock" required />
      <input name="categoryId" placeholder="category id" required />
      <button class="acc" type="submit">POST /products</button>
    </form>
    <div class="flex">
      <button id="prodsBtn">GET /products</button>
      <input id="prodId" placeholder="product id" />
      <button id="prodGetBtn">GET /:id</button>
      <button id="prodPutBtn">PUT</button>
      <button id="prodDelBtn">DELETE</button>
    </div>
    <div class="row">
      <input id="prodPrice" type="number" placeholder="new price (PUT)" />
      <input id="prodStock" type="number" placeholder="new stock (PUT)" />
    </div>
    <div class="out" id="prodsOut">—</div>
  </div>

  <!-- CART -->
  <div class="card">
    <h2>Cart Items</h2>
    <form id="cartForm">
      <input name="userId" placeholder="user id" required />
      <input name="productId" placeholder="product id" required />
      <input name="quantity" type="number" placeholder="quantity" required />
      <button class="acc" type="submit">POST /cart-items</button>
    </form>
    <div class="flex">
      <input id="cartUserId" placeholder="user id (filter)" />
      <button id="cartsBtn">GET /cart-items</button>
      <input id="cartId" placeholder="cart item id" />
      <button id="cartPatchBtn">PATCH qty</button>
      <button id="cartDelBtn">DELETE</button>
    </div>
    <input id="cartQty" type="number" placeholder="new quantity (PATCH)" />
    <div class="out" id="cartsOut">—</div>
  </div>

  <!-- ORDERS -->
  <div class="card">
    <h2>Orders</h2>
    <form id="orderCartForm">
      <input name="userId" placeholder="user id" required />
      <button class="acc" type="submit">POST /orders (from cart)</button>
    </form>
    <div class="row">
      <input id="orderUserId" placeholder="user id" />
      <input id="orderProdId" placeholder="product id" />
      <input id="orderQty" type="number" placeholder="qty" />
      <input id="orderPrice" type="number" placeholder="price" />
    </div>
    <button id="orderItemsBtn">POST /orders (custom items)</button>
    <div class="flex">
      <button id="ordersBtn">GET /orders</button>
      <input id="orderUserIdF" placeholder="filter ?userId=" />
      <button id="ordersFilterBtn">GET /orders?userId=</button>
    </div>
    <div class="flex">
      <input id="orderId" placeholder="order id" />
      <button id="orderGetBtn">GET /:id</button>
      <button id="orderItemsGetBtn">GET /:id/items</button>
      <button id="orderPatchBtn">PATCH</button>
      <button id="orderDelBtn">DELETE</button>
    </div>
    <select id="orderStatus">
      <option value="">status…</option>
      <option>PENDING</option><option>PROCESSING</option><option>SHIPPED</option>
      <option>COMPLETED</option><option>CANCELLED</option>
    </select>
    <div class="out" id="ordersOut">—</div>
  </div>
</div>

<script>
const BASE = "/api";
const state = {
  access: localStorage.getItem("acc") || "",
  refresh: localStorage.getItem("ref") || "",
};

const $ = (id) => document.getElementById(id);
const out = (el, data, isErr) => {
  const s = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  el.textContent = s;
  el.className = "out" + (isErr ? " err" : "");
};

async function api(path, { method = "GET", body, useAccess = true } = {}) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (useAccess && state.access) headers["Authorization"] = "Bearer " + state.access;
  const res = await fetch(BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch { data = await res.text(); }
  if (res.status >= 400) {
    throw { status: res.status, data };
  }
  return { status: res.status, data };
}

const fmt = (r) => `HTTP ${r.status}  ` + JSON.stringify(r.data, null, 2);
const errf = (e) => `HTTP ${e.status || "ERR"}  ` + JSON.stringify(e.data || e.message, null, 2);

function storeTokens(d) {
  if (d && d.accessToken) { state.access = d.accessToken; localStorage.setItem("acc", d.accessToken); }
  if (d && d.refreshToken) { state.refresh = d.refreshToken; localStorage.setItem("ref", d.refreshToken); }
  $("tokenLabel").textContent = state.access ? "access token set (id " + state.access.slice(0, 8) + "…)" : "no access token";
}

async function doCall(label, promise) {
  const el = $("authOut");
  try {
    const r = await promise;
    const body = r.data && r.data.data ? r.data.data : r.data;
    if (body && body.accessToken) storeTokens(body);
    out(el, fmt(r));
  } catch (e) {
    out(el, errf(e), true);
  }
}

// --- AUTH ---
$("regForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  doCall("register", api("/auth/register", { method: "POST", body: Object.fromEntries(f) }));
});
$("loginForm").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  doCall("login", api("/auth/login", { method: "POST", body: Object.fromEntries(f) }));
});
$("meBtn").onclick = () => doCall("me", api("/auth/me"));
$("refreshBtn").onclick = () => {
  doCall("refresh", api("/auth/refresh", { method: "POST", useAccess: false, body: { refreshToken: state.refresh } }));
};
$("logoutBtn").onclick = () => {
  doCall("logout", api("/auth/logout", { method: "POST", useAccess: false, body: { refreshToken: state.refresh } }));
};
$("clearStore").onclick = () => {
  state.access = ""; state.refresh = ""; localStorage.clear();
  $("tokenLabel").textContent = "no access token";
  $("authOut").textContent = "tokens cleared";
};

// --- USERS ---
$("usersBtn").onclick = async () => {
  try { out($("usersOut"), fmt(await api("/users"))); } catch (e) { out($("usersOut"), errf(e), true); }
};
$("userGetBtn").onclick = async () => {
  try { out($("usersOut"), fmt(await api("/users/" + $("userId").value))); } catch (e) { out($("usersOut"), errf(e), true); }
};
$("userPatchBtn").onclick = async () => {
  try { out($("usersOut"), fmt(await api("/users/" + $("userId").value, { method: "PATCH", body: { name: $("userPatchName").value } }))); } catch (e) { out($("usersOut"), errf(e), true); }
};
$("userDelBtn").onclick = async () => {
  try { out($("usersOut"), fmt(await api("/users/" + $("userId").value, { method: "DELETE" }))); } catch (e) { out($("usersOut"), errf(e), true); }
};

// --- CATEGORIES ---
$("catForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try { out($("catsOut"), fmt(await api("/categories", { method: "POST", body: { name: new FormData(ev.target).get("name") } }))); } catch (e) { out($("catsOut"), errf(e), true); }
});
$("catsBtn").onclick = async () => {
  try { out($("catsOut"), fmt(await api("/categories"))); } catch (e) { out($("catsOut"), errf(e), true); }
};
$("catPatchBtn").onclick = async () => {
  try { out($("catsOut"), fmt(await api("/categories/" + $("catId").value, { method: "PATCH", body: { name: $("catPatchName").value } }))); } catch (e) { out($("catsOut"), errf(e), true); }
};
$("catDelBtn").onclick = async () => {
  try { out($("catsOut"), fmt(await api("/categories/" + $("catId").value, { method: "DELETE" }))); } catch (e) { out($("catsOut"), errf(e), true); }
};
$("catDelPermBtn").onclick = async () => {
  try { out($("catsOut"), fmt(await api("/categories/" + $("catId").value + "?permanent=true", { method: "DELETE" }))); } catch (e) { out($("catsOut"), errf(e), true); }
};

// --- PRODUCTS ---
$("prodForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = Object.fromEntries(new FormData(ev.target));
  b.price = Number(b.price); b.stock = Number(b.stock);
  try { out($("prodsOut"), fmt(await api("/products", { method: "POST", body: b }))); } catch (e) { out($("prodsOut"), errf(e), true); }
});
$("prodsBtn").onclick = async () => {
  try { out($("prodsOut"), fmt(await api("/products"))); } catch (e) { out($("prodsOut"), errf(e), true); }
};
$("prodGetBtn").onclick = async () => {
  try { out($("prodsOut"), fmt(await api("/products/" + $("prodId").value))); } catch (e) { out($("prodsOut"), errf(e), true); }
};
$("prodPutBtn").onclick = async () => {
  const b = { name: "updated", price: Number($("prodPrice").value), stock: Number($("prodStock").value) };
  try { out($("prodsOut"), fmt(await api("/products/" + $("prodId").value, { method: "PUT", body: b }))); } catch (e) { out($("prodsOut"), errf(e), true); }
};
$("prodDelBtn").onclick = async () => {
  try { out($("prodsOut"), fmt(await api("/products/" + $("prodId").value, { method: "DELETE" }))); } catch (e) { out($("prodsOut"), errf(e), true); }
};

// --- CART ---
$("cartForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = Object.fromEntries(new FormData(ev.target));
  b.quantity = Number(b.quantity);
  try { out($("cartsOut"), fmt(await api("/cart-items", { method: "POST", body: b }))); } catch (e) { out($("cartsOut"), errf(e), true); }
});
$("cartsBtn").onclick = async () => {
  const u = $("cartUserId").value;
  try { out($("cartsOut"), fmt(await api("/cart-items" + (u ? "?userId=" + encodeURIComponent(u) : "")))); } catch (e) { out($("cartsOut"), errf(e), true); }
};
$("cartPatchBtn").onclick = async () => {
  try { out($("cartsOut"), fmt(await api("/cart-items/" + $("cartId").value, { method: "PATCH", body: { quantity: Number($("cartQty").value) } }))); } catch (e) { out($("cartsOut"), errf(e), true); }
};
$("cartDelBtn").onclick = async () => {
  try { out($("cartsOut"), fmt(await api("/cart-items/" + $("cartId").value, { method: "DELETE" }))); } catch (e) { out($("cartsOut"), errf(e), true); }
};

// --- ORDERS ---
$("orderCartForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const userId = new FormData(ev.target).get("userId");
  try { out($("ordersOut"), fmt(await api("/orders", { method: "POST", body: { userId, cartItems: [] } }))); } catch (e) { out($("ordersOut"), errf(e), true); }
});
$("orderItemsBtn").onclick = async () => {
  const body = {
    userId: $("orderUserId").value,
    cartItems: [{
      productId: $("orderProdId").value,
      quantity: Number($("orderQty").value),
      price: Number($("orderPrice").value),
    }],
  };
  try { out($("ordersOut"), fmt(await api("/orders", { method: "POST", body }))); } catch (e) { out($("ordersOut"), errf(e), true); }
};
$("ordersBtn").onclick = async () => {
  try { out($("ordersOut"), fmt(await api("/orders"))); } catch (e) { out($("ordersOut"), errf(e), true); }
};
$("ordersFilterBtn").onclick = async () => {
  try { out($("ordersOut"), fmt(await api("/orders?userId=" + encodeURIComponent($("orderUserIdF").value)))); } catch (e) { out($("ordersOut"), errf(e), true); }
};
$("orderGetBtn").onclick = async () => {
  try { out($("ordersOut"), fmt(await api("/orders/" + $("orderId").value))); } catch (e) { out($("ordersOut"), errf(e), true); }
};
$("orderItemsGetBtn").onclick = async () => {
  try { out($("ordersOut"), fmt(await api("/orders/" + $("orderId").value + "/items"))); } catch (e) { out($("ordersOut"), errf(e), true); }
};
$("orderPatchBtn").onclick = async () => {
  const body = {};
  const st = $("orderStatus").value;
  if (st) body.status = st;
  try { out($("ordersOut"), fmt(await api("/orders/" + $("orderId").value, { method: "PATCH", body }))); } catch (e) { out($("ordersOut"), errf(e), true); }
};
$("orderDelBtn").onclick = async () => {
  try { out($("ordersOut"), fmt(await api("/orders/" + $("orderId").value, { method: "DELETE" }))); } catch (e) { out($("ordersOut"), errf(e), true); }
};

storeTokens(null);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyShop</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --border:#e3e6ea; --txt:#1c2330; --mut:#6b7484; --acc:#2563eb; --acc2:#1d4ed8; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  a { color:var(--acc); text-decoration:none; }
  .nav { background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  .nav-in { max-width:1080px; margin:auto; display:flex; align-items:center; gap:18px; padding:12px 20px; }
  .brand { font-weight:800; font-size:18px; color:var(--acc); letter-spacing:.3px; }
  .nav-in a.nlink { color:var(--txt); padding:6px 10px; border-radius:8px; font-weight:600; }
  .nav-in a.nlink:hover { background:var(--bg); }
  .spacer { flex:1; }
  .user-chip { font-size:13px; color:var(--mut); }
  .btn { background:var(--acc); color:#fff; border:0; border-radius:9px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .btn:hover { background:var(--acc2); }
  .btn.ghost { background:transparent; color:var(--acc); border:1px solid var(--border); }
  .btn.danger { background:var(--bad); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .wrap { max-width:1080px; margin:auto; padding:24px 20px 60px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .prod { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .prod .name { font-weight:700; }
  .prod .price { color:var(--acc); font-weight:800; font-size:18px; }
  .prod .stock { font-size:12px; color:var(--mut); }
  .prod .low { color:var(--bad); }
  .prod .btn { margin-top:auto; }
  .catbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .catbar button { background:var(--card); border:1px solid var(--border); border-radius:999px; padding:7px 14px; cursor:pointer; font:inherit; }
  .catbar button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input, select { border:1px solid var(--border); border-radius:9px; padding:9px 12px; font:inherit; }
  .authbox { max-width:360px; margin:40px auto; display:flex; flex-direction:column; gap:10px; }
  .authbox input { width:100%; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { flex:1; padding:10px; border:1px solid var(--border); background:var(--card); border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
  .tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .cart-row { display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
  .cart-row .info { flex:1; }
  .cart-row .qty { display:flex; align-items:center; gap:8px; }
  .cart-row .qty button { width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:16px; }
  .total { text-align:right; font-size:20px; font-weight:800; margin:18px 0; }
  .empty { color:var(--mut); text-align:center; padding:40px 0; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:11px 18px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; }
  .toast.show { opacity:1; }
  .muted { color:var(--mut); font-size:13px; }
  .order { border-bottom:1px solid var(--border); padding:12px 0; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.PENDING{background:#fff7e6;color:#b45309}.badge.PROCESSING{background:#e6f0ff;color:#1d4ed8}
  .badge.SHIPPED{background:#eef2ff;color:#4338ca}.badge.COMPLETED{background:#e8f7ee;color:#15803d}
  .badge.CANCELLED{background:#fdeaea;color:#b91c1c}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-in">
    <span class="brand">MyShop</span>
    <a class="nlink" href="#/">Shop</a>
    <a class="nlink" href="#/cart">Cart <span id="cartCount"></span></a>
    <a class="nlink" href="#/orders">Orders</a>
    <div class="spacer"></div>
    <span class="user-chip" id="userChip"></span>
    <button class="btn ghost" id="authBtn" style="display:none"></button>
  </div>
</div>

<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<script>
const BASE = "/api";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const state = {
  access: localStorage.getItem("acc") || "",
  refresh: localStorage.getItem("ref") || "",
  user: JSON.parse(localStorage.getItem("user") || "null"),
  cats: [],
  prods: [],
  cart: [],
  activeCat: null,
};

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, { method = "GET", body, auth = true } = {}) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (auth && state.access) headers["Authorization"] = "Bearer " + state.access;
  const res = await fetch(BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.message) || "Request failed (" + res.status + ")");
  return data;
}

function setUser(u, tokens) {
  state.user = u;
  if (tokens) {
    state.access = tokens.accessToken;
    state.refresh = tokens.refreshToken;
    localStorage.setItem("acc", state.access);
    localStorage.setItem("ref", state.refresh);
  }
  localStorage.setItem("user", JSON.stringify(u));
  renderNav();
}

async function restoreSession() {
  if (!state.access) return;
  try {
    const r = await api("/auth/me");
    setUser(r.data);
  } catch {
    state.access = state.refresh = ""; localStorage.removeItem("acc"); localStorage.removeItem("ref"); localStorage.removeItem("user");
    state.user = null;
    renderNav();
  }
}

async function ensureLogin() {
  if (state.user) return true;
  toast("Please login first");
  location.hash = "#/auth";
  return false;
}

function renderNav() {
  $("#userChip").textContent = state.user ? state.user.email : "";
  const b = $("#authBtn");
  b.style.display = "inline-block";
  b.textContent = state.user ? "Logout" : "Login";
  b.className = "btn ghost";
  b.onclick = () => {
    if (state.user) {
      if (state.refresh) api("/auth/logout", { method: "POST", auth: false, body: { refreshToken: state.refresh } }).catch(() => {});
      state.user = null; state.access = state.refresh = "";
      localStorage.clear();
      toast("Logged out");
      renderNav();
      if (location.hash !== "#/auth") location.hash = "#/";
    } else location.hash = "#/auth";
  };
}

async function loadShop() {
  const [c, p] = await Promise.all([api("/categories"), api("/products")]);
  state.cats = c.data;
  state.prods = p.data;
  renderShop();
}

function renderShop() {
  const cat = state.cats.find(c => c.id === state.activeCat);
  const list = state.activeCat ? state.prods.filter(p => p.categoryId === state.activeCat) : state.prods;
  $("#view").innerHTML = `
    <div class="catbar">
      <button class="${state.activeCat ? "" : "on"}" data-cat="">All</button>
      ${state.cats.map(c => `<button class="${state.activeCat === c.id ? "on" : ""}" data-cat="${c.id}">${esc(c.name)}</button>`).join("")}
    </div>
    ${list.length ? `<div class="grid">${list.map(p => `
      <div class="prod">
        <div class="name">${esc(p.name)}</div>
        <div class="price">৳${p.price}</div>
        <div class="stock ${p.stock === 0 ? "low" : ""}">${p.stock === 0 ? "Out of stock" : "In stock: " + p.stock}</div>
        <button class="btn" data-add="${p.id}" ${p.stock === 0 ? "disabled" : ""}>Add to cart</button>
      </div>`).join("")}</div>` : `<div class="empty">No products in this category yet</div>`
    }`;
  document.querySelectorAll(".catbar button").forEach(b => b.onclick = () => { state.activeCat = b.dataset.cat || null; renderShop(); });
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => addToCart(b.dataset.add));
}

async function addToCart(productId) {
  if (!await ensureLogin()) return;
  try {
    await api("/cart-items", { method: "POST", body: { userId: state.user.id, productId, quantity: 1 } });
    toast("Added to cart");
    refreshCart();
  } catch (e) { toast(e.message); }
}

async function refreshCart() {
  if (!state.user) return;
  try {
    const r = await api("/cart-items?userId=" + state.user.id);
    state.cart = r.data;
    $("#cartCount").textContent = state.cart.length ? "(" + state.cart.length + ")" : "";
    if (location.hash === "#/cart") renderCart();
  } catch { state.cart = []; $("#cartCount").textContent = ""; }
}

function renderCart() {
  if (!state.user) { $("#view").innerHTML = `<div class="empty">Login to view your cart</div>`; return; }
  if (!state.cart.length) { $("#view").innerHTML = `<div class="empty">Your cart is empty</div>`; return; }
  const total = state.cart.reduce((s, i) => s + i.product.price * i.quantity, 0);
  $("#view").innerHTML = `
    <div class="card">
      ${state.cart.map(i => `
        <div class="cart-row" data-id="${i.id}">
          <div class="info"><b>${esc(i.product.name)}</b><br><span class="muted">৳${i.product.price} each</span></div>
          <div class="qty">
            <button data-dec="${i.id}">−</button>
            <b>${i.quantity}</b>
            <button data-inc="${i.id}">+</button>
          </div>
          <b>৳${i.product.price * i.quantity}</b>
          <button class="btn danger" data-del="${i.id}">Remove</button>
        </div>`).join("")}
      <div class="total">Total: ৳${total}</div>
      <div class="row"><button class="btn" id="checkout">Place Order</button></div>
    </div>`;
  document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => changeQty(b.dataset.inc, +1));
  document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => changeQty(b.dataset.dec, -1));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => removeItem(b.dataset.del));
  $("#checkout").onclick = placeOrder;
}

async function changeQty(id, delta) {
  const item = state.cart.find(i => i.id === id);
  if (!item) return;
  const q = item.quantity + delta;
  if (q < 1) return;
  try {
    await api("/cart-items/" + id, { method: "PATCH", body: { quantity: q } });
    await refreshCart();
  } catch (e) { toast(e.message); }
}

async function removeItem(id) {
  try {
    await api("/cart-items/" + id, { method: "DELETE" });
    await refreshCart();
  } catch (e) { toast(e.message); }
}

async function placeOrder() {
  if (!await ensureLogin()) return;
  const btn = $("#checkout"); btn.disabled = true; btn.textContent = "Placing…";
  try {
    await api("/orders", { method: "POST", body: { userId: state.user.id, cartItems: [] } });
    toast("Order placed!");
    state.cart = [];
    $("#cartCount").textContent = "";
    location.hash = "#/orders";
  } catch (e) { btn.disabled = false; btn.textContent = "Place Order"; toast(e.message); }
}

async function renderOrders() {
  if (!state.user) { $("#view").innerHTML = `<div class="empty">Login to view your orders</div>`; return; }
  const r = await api("/orders?userId=" + state.user.id);
  if (!r.data.length) { $("#view").innerHTML = `<div class="empty">No orders yet</div>`; return; }
  $("#view").innerHTML = r.data.map(o => `
    <div class="card order" style="margin-bottom:14px">
      <div class="row"><b>Order ${o.id.slice(0, 8)}</b><span class="badge ${o.status}">${o.status}</span><span class="muted">${new Date(o.placedAt).toLocaleString()}</span></div>
      <div class="muted" style="margin-top:4px">Total: <b>৳${o.totalAmount}</b></div>
    </div>`).join("");
}

function renderAuth() {
  $("#view").innerHTML = `
    <div class="authbox">
      <div class="tabs"><button id="tabLog" class="on">Login</button><button id="tabReg">Register</button></div>
      <form id="authForm">
        <input name="name" id="fName" placeholder="Name" style="display:none" />
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password (min 8)" required />
        <button class="btn" type="submit">Login</button>
      </form>
    </div>`;
  let mode = "login";
  const toggle = () => {
    mode = mode === "login" ? "register" : "login";
    $("#tabLog").classList.toggle("on", mode === "login");
    $("#tabReg").classList.toggle("on", mode === "register");
    $("#fName").style.display = mode === "register" ? "block" : "none";
    $("#authForm button").textContent = mode === "register" ? "Register" : "Login";
  };
  $("#tabLog").onclick = () => mode !== "login" && toggle();
  $("#tabReg").onclick = () => mode !== "register" && toggle();
  $("#authForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    try {
      if (mode === "register") {
        await api("/auth/register", { method: "POST", auth: false, body: { name: fd.get("name"), email: fd.get("email"), password: fd.get("password") } });
      }
      const r = await api("/auth/login", { method: "POST", auth: false, body: { email: fd.get("email"), password: fd.get("password") } });
      setUser(r.data.user, { accessToken: r.data.accessToken, refreshToken: r.data.refreshToken });
      toast("Welcome, " + r.data.user.name + "!");
      location.hash = "#/";
    } catch (e) { toast(e.message); }
  };
}

const routes = {
  "#/": async () => { await loadShop(); },
  "#/cart": async () => { await refreshCart(); renderCart(); },
  "#/orders": async () => { await renderOrders(); },
  "#/auth": () => renderAuth(),
};

window.addEventListener("hashchange", () => router());
async function router() {
  const fn = routes[location.hash] || routes["#/"];
  try { await fn(); } catch (e) { $("#view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

restoreSession().then(() => { renderNav(); router(); });
</script>
</body>
</html>
